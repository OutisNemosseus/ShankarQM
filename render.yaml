services:
  - type: web
    name: quantum-mechanics-notes
    runtime: static
    buildCommand: npm ci && npx quartz plugin install --from-config && npx quartz build && node scripts/duplicate-clean-urls.mjs
    staticPublishPath: ./public
    autoDeployTrigger: commit
    routes:
      - type: redirect
        source: /*
        destination: /*/
